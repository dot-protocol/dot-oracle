name: ci
on:
  push: { branches: [dev, prod] }
  pull_request:
permissions: { contents: read }
# Line tables only, and no incremental cache: about 60 integration-test binaries each link the whole server, and with full
# debug info they filled the hosted runner's disk until the linker died with a bus error (4 Nov 2026). Backtraces keep
# their file and line.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
jobs:
  formal:
    uses: ./.github/workflows/formal-security.yml
  security:
    uses: ./.github/workflows/dependency-security.yml
  test:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: { toolchain: "1.96.0", components: clippy }
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: ./scripts/e2e.sh
