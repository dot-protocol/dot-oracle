name: ci
on:
  push: { branches: [dev, prod] }
  pull_request:
# Line tables only, and no incremental cache: about 60 integration-test binaries each link the whole server, and with full
# debug info they filled the hosted runner's disk until the linker died with a bus error (4 Nov 2026). Backtraces keep
# their file and line.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
jobs:
  test:
    strategy:
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: ./scripts/e2e.sh
