name: release
# A tag builds every platform the README names, installs each build on a fresh machine of that platform with the
# README's own installer, and publishes only when every one of them passes `ox doctor` and reads back a signed memory.
# Then it installs from the public release, as a stranger would, and checks again (Blaze, 1 Nov 2026: "failing is
# failing, why are we shipping failing things"). A push to dev that changes the installers, or workflow_dispatch, runs
# everything except publishing.
on:
  push:
    tags: ["v*"]
    # A change to how dotOracle installs is proved on every platform the moment it lands (nothing publishes from a branch).
    branches: [dev]
    paths: [".github/workflows/release.yml", "scripts/install.sh", "scripts/install.ps1", "scripts/smoke-install.sh", "scripts/no-phone-home.sh", "scripts/smoke-install.ps1", "scripts/installer-edges.sh", "scripts/installer-edges.ps1"]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest,     target: aarch64-apple-darwin }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env: { ORACLE_BUILD_COMMIT: "${{ github.sha }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: contains(matrix.target, 'linux')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} -p oracle-server -p ox
      - name: package (unix)
        if: "!contains(matrix.target, 'windows')"
        shell: bash
        run: |
          mkdir -p dist && cd target/${{ matrix.target }}/release
          tar -czf "$GITHUB_WORKSPACE/dist/oracle-${{ matrix.target }}.tar.gz" oracle ox
          cd "$GITHUB_WORKSPACE/dist" && (sha256sum oracle-${{ matrix.target }}.tar.gz || shasum -a 256 oracle-${{ matrix.target }}.tar.gz) > oracle-${{ matrix.target }}.tar.gz.sha256
      - name: package (windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/${{ matrix.target }}/release/oracle.exe, target/${{ matrix.target }}/release/ox.exe -DestinationPath dist/oracle-${{ matrix.target }}.zip
          $h = (Get-FileHash dist/oracle-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          "$h  oracle-${{ matrix.target }}.zip" | Out-File -Encoding ascii -NoNewline dist/oracle-${{ matrix.target }}.zip.sha256
      - uses: actions/upload-artifact@v4
        with: { name: "oracle-${{ matrix.target }}", path: dist/* }

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: the README install and first minute (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cp scripts/install.sh scripts/smoke-install.sh dist/
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > /dev/null 2>&1 &
          sleep 2
          ORACLE_DOWNLOAD_BASE="http://127.0.0.1:8765" HOME="$(mktemp -d)" sh dist/smoke-install.sh
      - name: the installer's edges (macOS, Linux; plan.oracle.everyone J7)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh scripts/installer-edges.sh dist
          if INSTALLER_EDGES_CONTROL=1 sh scripts/installer-edges.sh dist; then
            echo "the negative control passed, so the test cannot see an install it should have refused" >&2; exit 1
          fi
      - name: no phone home (Linux; Blaze, 4 Nov 2026, before v0.1.0)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y strace > /dev/null
          python3 -m http.server 8766 --bind 127.0.0.1 --directory dist > /dev/null 2>&1 &
          sleep 2
          export HOME="$(mktemp -d)"
          ORACLE_DOWNLOAD_BASE="http://127.0.0.1:8766" sh dist/install.sh
          sudo ORACLE_BIN_DIR="$HOME/.local/bin" sh scripts/no-phone-home.sh
          if sudo NO_PHONE_HOME_CONTROL=1 ORACLE_BIN_DIR="$HOME/.local/bin" sh scripts/no-phone-home.sh; then
            echo "the negative control passed, so the test cannot see an outbound connect" >&2; exit 1
          fi
      - name: the README install and first minute (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item scripts/install.ps1, scripts/smoke-install.ps1 dist/
          # Served over HTTP as GitHub serves a release: PowerShell's Invoke-WebRequest does not read file:// at all.
          Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'dist' -WindowStyle Hidden
          Start-Sleep 3
          $env:ORACLE_DOWNLOAD_BASE = 'http://127.0.0.1:8765'
          ./dist/smoke-install.ps1
      - name: the installer's edges (Windows; plan.oracle.everyone J7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/installer-edges.ps1 dist
          $env:INSTALLER_EDGES_CONTROL = '1'
          $failed = $false
          try { ./scripts/installer-edges.ps1 dist } catch { $failed = $true; Write-Host "control failed as it must: $_" }
          if (-not $failed) { throw 'the negative control passed, so the test cannot see an install it should have refused' }

  publish:
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: cp scripts/install.sh scripts/install.ps1 dist/
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }

  public:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: the one line from the README, from the public release (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh -o install.sh
          cp scripts/smoke-install.sh . && HOME="$(mktemp -d)" ORACLE_REPO=${{ github.repository }} sh smoke-install.sh
      - name: the one line from the README, from the public release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ORACLE_REPO = '${{ github.repository }}'
          Invoke-WebRequest https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 -OutFile install.ps1 -UseBasicParsing
          Copy-Item scripts/smoke-install.ps1 . ; ./smoke-install.ps1
