name: dependency-security
on:
  workflow_call:
permissions: { contents: read }
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with: { toolchain: "1.96.0" }
      - name: install pinned security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: policy checks and known-advisory negative controls
        run: python3 scripts/check-dependency-security.py
